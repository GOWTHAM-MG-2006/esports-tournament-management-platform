[tool.ruff]
target-version = "py312"

# E/F/I/UP: errors, pyflakes, import order, pyupgrade.
# Django/DRF class attributes (Meta.fields, permission_classes, migration
# lists) are framework idioms, so RUF012 is intentionally not enabled.
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # long lines pre-date the linter; enforced going forward by review
