name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esports_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run checks
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/esports_db
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
        run: |
          cd backend
          python manage.py check
          cd ..
          ruff check backend/
          cd backend
          python manage.py migrate
          cd ..
          pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to EC2 (pull, rebuild, migrate, health-check)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY" > ~/.ssh/capstone.pem
          chmod 600 ~/.ssh/capstone.pem
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/capstone.pem "${EC2_USER}@${EC2_HOST}" \
            'cd /home/ec2-user/capstone && git pull origin main && docker compose up -d --build && docker compose run --rm backend python manage.py migrate && for i in $(seq 1 12); do sleep 5; if curl -fsS http://${{ vars.EC2_HOST }}/api/health/; then break; fi; if [ "$i" = 12 ]; then echo "health check failed after 60s"; exit 1; fi; done'
