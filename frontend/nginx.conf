# Serves the SPA; /api/* is proxied to the Django backend (same-origin,
# so no CORS configuration is needed in production).
server {
    listen 80;
    server_name _;

    # Gzip the JS bundle for faster first paint.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: unknown paths serve index.html for react-router.
        try_files $uri $uri/ /index.html;
    }
}
